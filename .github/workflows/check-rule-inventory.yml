name: Check Rule Inventory

# Every PR, unfiltered: an edit to any skill, agent, or reference can leave an inventory anchor dangling.
# The candidate guard runs here too, since the inventory's owners point into the candidate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check the orchestrate-epic rule inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the inventory structure and anchors
        run: tests/check-rule-inventory.sh

      - name: Check the candidate stays out of discovery and drives oe only
        run: tests/check-candidate.sh

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Test the checker and the candidate guard
        run: bats tests/check-rule-inventory.bats tests/check-candidate.bats
