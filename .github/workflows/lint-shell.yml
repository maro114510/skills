name: Lint Shell Scripts

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '**.bats'
      - '.shellcheckrc'
  pull_request:
    paths:
      - '**.sh'
      - '**.bats'
      - '.shellcheckrc'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-review-tests:
    name: Self-review script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run self-review.sh test suite
        run: bats skills/implement/scripts/test-self-review.bats

  create-pr-script-tests:
    name: create-pr script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run create-linked-pr.sh test suite
        run: bash skills/create-pr/scripts/test-create-linked-pr.sh

      - name: Run issue-refs.sh test suite
        run: bash skills/create-pr/scripts/test-issue-refs.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config p/security-audit --config p/secrets --error .
