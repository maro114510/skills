name: Lint Shell Scripts

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '**.bats'
      - '.shellcheckrc'
      - '.github/workflows/lint-shell.yml'
  pull_request:
    paths:
      - '**.sh'
      - '**.bats'
      - '.shellcheckrc'
      - '.github/workflows/lint-shell.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test files are discovered, so adding one needs no workflow change.
  bats-tests:
    name: Bats script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run every skills/**/*.bats suite
        run: find skills -name '*.bats' -print0 | sort -z | xargs -0 bats

      - name: Run the push-approval hook suite
        run: bats tests/require-user-approval.bats

  shell-script-tests:
    name: Shell script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every skills/*/scripts/test-*.sh suite
        run: |
          rc=0
          for t in skills/*/scripts/test-*.sh; do
            echo "::group::${t}"
            bash "${t}" || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config p/security-audit --config p/secrets --error .
