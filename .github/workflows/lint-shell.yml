name: Lint Shell Scripts

on:
  push:
    branches: [main]
    paths:
      - '**.sh'
      - '**.bats'
      - 'tests/implement-repro/**'
      - '.shellcheckrc'
      - '.github/workflows/lint-shell.yml'
      # The oe wrapper has no .sh extension.
      # The other paths are read by the oe release isolation tests.
      - 'skills/orchestrate-epic/scripts/oe'
      - 'skills/orchestrate-epic/scripts/oe-manifest.tsv'
      - 'cliff.toml'
      - 'Makefile'
      - '.github/workflows/release.yml'
      - '.github/workflows/oe-release.yml'
  pull_request:
    paths:
      - '**.sh'
      - '**.bats'
      - 'tests/implement-repro/**'
      - '.shellcheckrc'
      - '.github/workflows/lint-shell.yml'
      # The oe wrapper has no .sh extension.
      # The other paths are read by the oe release isolation tests.
      - 'skills/orchestrate-epic/scripts/oe'
      - 'skills/orchestrate-epic/scripts/oe-manifest.tsv'
      - 'cliff.toml'
      - 'Makefile'
      - '.github/workflows/release.yml'
      - '.github/workflows/oe-release.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test files are discovered, so adding one needs no workflow change.
  bats-tests:
    name: Bats script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run every skills/**/*.bats suite
        run: find skills -name '*.bats' -print0 | sort -z | xargs -0 bats

      - name: Run the push-approval hook suite
        run: bats tests/require-user-approval.bats

      - name: Run the implement reproduction repository suite
        run: bats tests/implement-repro.bats

      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/git-cliff.tar.gz"
          curl -fsSL --retry 3 -o "${tarball}" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Run the oe manifest and release isolation suites
        run: bats tests/oe-manifest.bats tests/oe-release-isolation.bats

  shell-script-tests:
    name: Shell script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every skills/*/scripts/test-*.sh suite
        run: |
          rc=0
          for t in skills/*/scripts/test-*.sh; do
            echo "::group::${t}"
            bash "${t}" || rc=1
            echo "::endgroup::"
          done
          exit "${rc}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: '.'

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config p/security-audit --config p/secrets --error .
