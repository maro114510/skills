name: Test Plugin Installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin manifests
        run: claude plugin validate .

  test-install:
    name: Test plugin installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # marketplace.json names the plugin's source as the GitHub repo, which
      # installs the default branch and never the PR under test. Point it at
      # this checkout, in the runner's copy only.
      - name: Point the plugin source at this checkout
        run: |
          jq '.plugins |= map(.source = "./")' .claude-plugin/marketplace.json > "${RUNNER_TEMP}/marketplace.json"
          mv "${RUNNER_TEMP}/marketplace.json" .claude-plugin/marketplace.json
          jq -e '.plugins | all(.source == "./")' .claude-plugin/marketplace.json
          echo "Installing the checkout of ${GITHUB_SHA}"

      - name: Add marketplace
        run: claude plugin marketplace add ./

      - name: List marketplaces
        run: claude plugin marketplace list

      - name: Install plugin
        run: claude plugin install skills@maro114510-agent-skills --scope user

      - name: Verify installation
        run: claude plugin list | grep skills

      - name: Show the installed source and contents
        run: |
          install_path="$(jq -r '.plugins["skills@maro114510-agent-skills"][0].installPath' "${CLAUDE_CONFIG_DIR:-${HOME}/.claude}/plugins/installed_plugins.json")"
          echo "Installed at: ${install_path}"
          echo "Source commit: ${GITHUB_SHA}"
          claude plugin list
          echo "::group::Installed skills"
          find "${install_path}/skills" -type f | sort
          echo "::endgroup::"
          # The install must equal this checkout, so a PR's own changes are what loads.
          diff -r --exclude=.git . "${install_path}"
          echo "The installed plugin is identical to this checkout"
          echo "INSTALL_PATH=${install_path}" >> "${GITHUB_ENV}"

      # The installed copy is what loads, so a broken SKILL.md or agent fails here.
      - name: Validate the installed skills and agents
        run: |
          claude plugin validate --strict "${INSTALL_PATH}/skills"
          claude plugin validate --strict "${INSTALL_PATH}/agents"
