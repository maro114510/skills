name: Release oe

# Publishes the oe binaries for an oe-v tag.
# Plugin releases use v tags in release.yml, and the two never overlap.
# Afterwards run make oe-manifest TAG=<tag> and open a PR with the result.

on:
  push:
    tags:
      - 'oe-v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'
  GOFLAGS: -mod=readonly

jobs:
  oe-release:
    name: Build and publish oe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is a release version on main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          printf '%s\n' "${TAG_NAME}" | grep -Eq '^oe-v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "${TAG_NAME} is not oe-vMAJOR.MINOR.PATCH"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "${TAG_NAME} points at ${GITHUB_SHA}, which is not on main"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: oe/go.mod
          cache-dependency-path: oe/go.sum

      - name: Test
        working-directory: oe
        run: |
          go vet ./...
          go test ./...

      - name: Build the release assets
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: make -C oe dist VERSION="${TAG_NAME}"

      - name: Verify the runner-native binary reports the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          reported="$(oe/dist/oe_linux_amd64 --version)"
          test "${reported}" = "${TAG_NAME}" || { echo "oe reports '${reported}', expected '${TAG_NAME}'"; exit 1; }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes "oe binaries for ${TAG_NAME}, built from ${GITHUB_SHA}. Run make oe-manifest TAG=${TAG_NAME} and open a PR to pin them." \
            --verify-tag \
            oe/dist/oe_darwin_arm64 \
            oe/dist/oe_darwin_amd64 \
            oe/dist/oe_linux_arm64 \
            oe/dist/oe_linux_amd64 \
            oe/dist/SHA256SUMS
