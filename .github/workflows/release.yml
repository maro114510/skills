name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          # The Previous release is the published GitHub Release with the highest version, other than this tag.
          previous="$(gh release list --limit 1000 --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft | not) | select(.isPrerelease | not) | .tagName' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "${TAG_NAME}" | sort -V | tail -n 1 || true)"
          test -n "${previous}" || { echo "No previous release found; refusing to release"; exit 1; }
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"

      - name: Verify the publish guards
        env:
          TAG_NAME: ${{ github.ref_name }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: bash .github/scripts/release.sh guard "${TAG_NAME}" "${PREVIOUS}"

      - name: Install git-cliff
        run: pipx install git-cliff==2.14.2

      - name: Generate the release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          PREVIOUS: ${{ steps.previous.outputs.previous }}
        run: bash .github/scripts/release.sh notes "${TAG_NAME}" "${PREVIOUS}" > "${RUNNER_TEMP}/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "${TAG_NAME}" --title "${TAG_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
