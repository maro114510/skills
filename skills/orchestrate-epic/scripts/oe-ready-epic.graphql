# The Epic read of oe ready.
# It returns the default branch head with its checks and the list of child Issues.
query($owner: String!, $repo: String!, $epic: Int!) {
  repository(owner: $owner, name: $repo) {
    nameWithOwner
    defaultBranchRef {
      name
      target { ... on Commit { ...HeadChecks } }
    }
    issue(number: $epic) {
      subIssues(first: 100) {
        totalCount
        nodes { number repository { nameWithOwner } }
      }
    }
  }
}

fragment HeadChecks on Commit {
  oid
  statusCheckRollup {
    contexts(first: 100) {
      totalCount
      # oe-ready.sh reads the remaining pages with oe-ready-checks.graphql.
      pageInfo { hasNextPage endCursor }
      nodes {
        __typename
        ... on CheckRun { name status conclusion startedAt checkSuite { databaseId workflowRun { workflow { databaseId } } } }
        ... on StatusContext { context state createdAt }
      }
    }
  }
}
