# The Epic read of oe ready.
# It returns the default branch name and the list of child Issues.
query($owner: String!, $repo: String!, $epic: Int!) {
  repository(owner: $owner, name: $repo) {
    nameWithOwner
    defaultBranchRef { name }
    issue(number: $epic) {
      subIssues(first: 100) {
        totalCount
        nodes { number state repository { nameWithOwner } }
      }
    }
  }
}
