# prek (https://github.com/j178/prek) — pre-commit hook runner
# Setup: prek install

[[repos]]
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.10.0"

  [[repos.hooks]]
  id = "shellcheck"

[[repos]]
repo = "https://github.com/mvdan/sh"
rev = "v3.13.1"

  [[repos.hooks]]
  id = "shfmt"
  args = ["-d", "-i", "2"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

  [[repos.hooks]]
  id = "actionlint"
