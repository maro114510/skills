# prek (https://github.com/j178/prek) — pre-commit hook runner
# Setup: prek install

[[repos]]
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.10.0"

  [[repos.hooks]]
  id = "shellcheck"
  args = ["--severity=warning", "--shell=bash"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.7"

  [[repos.hooks]]
  id = "actionlint"
