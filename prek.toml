# prek (https://github.com/j178/prek) — pre-commit hook runner
# Setup: prek install

[[repos]]
repo = "https://github.com/koalaman/shellcheck-precommit"
rev = "v0.10.0"

  [[repos.hooks]]
  id = "shellcheck"

[[repos]]
repo = "local"

  [[repos.hooks]]
  id = "shfmt"
  name = "shfmt"
  language = "system"
  entry = "shfmt"
  args = ["-d", "-i", "2"]
  types = ["shell"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"

  [[repos.hooks]]
  id = "actionlint"
